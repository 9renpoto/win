name: Algolia Index Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - posts/**
      - content/**
      - src/lib/content/**
      - src/lib/types.ts
      - scripts/content.ts
      - package.json
      - package-lock.json
      - scripts/sync_algolia_index.ts

permissions:
  contents: read

jobs:
  sync-index:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # Node.js 24 LTS
          cache: npm

      - run: npm ci

      - name: Sync Algolia index
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run algolia:sync
