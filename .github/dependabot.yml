version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "actions/*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      textlint:
        patterns:
          - "textlint"
          - "textlint-*"
      sveltejs:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-checker"
